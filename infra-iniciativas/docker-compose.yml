# =====================================================================
# Orquestación completa de microservicios — Producción
#
# Levanta: 3 frontends + API Gateway + 6 microservicios + 6 DBs + Redis
#
#   cp .env.example .env   (y completar)
#   docker compose up -d --build
# =====================================================================

services:
  # ----- Bases de datos -----

  db-auth:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_AUTH_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_autenticacion_db
      MYSQL_USER: ms_autenticacion_app
      MYSQL_PASSWORD: ${DB_AUTH_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_auth:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_AUTH_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  db-iniciativas:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_INIC_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_iniciativas_db
      MYSQL_USER: ms_iniciativas_app
      MYSQL_PASSWORD: ${DB_INIC_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_iniciativas:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_INIC_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  db-radicacion:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_RAD_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_radicacion_db
      MYSQL_USER: ms_radicacion_app
      MYSQL_PASSWORD: ${DB_RAD_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_radicacion:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_RAD_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  db-flujo:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_FLUJO_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_flujo_estados_db
      MYSQL_USER: ms_flujo_estados_app
      MYSQL_PASSWORD: ${DB_FLUJO_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_flujo:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_FLUJO_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  db-notificaciones:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_NOTI_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_notificaciones_db
      MYSQL_USER: ms_notificaciones_app
      MYSQL_PASSWORD: ${DB_NOTI_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_notificaciones:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_NOTI_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  db-admin:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_ROOT_PASSWORD}
      MYSQL_DATABASE: ms_administracion_db
      MYSQL_USER: ms_administracion_app
      MYSQL_PASSWORD: ${DB_ADMIN_PASSWORD}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [datos_admin:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -p${DB_ADMIN_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]

  # ----- Redis (sesiones y colas) -----

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [datos_redis:/data]
    networks: [interna]

  # ----- Microservicios -----

  ms-autenticacion:
    build: { context: ../ms-autenticacion, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db-auth
      DB_NAME: ms_autenticacion_db
      DB_USER: ms_autenticacion_app
      DB_PASSWORD: ${DB_AUTH_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    depends_on: { db-auth: { condition: service_healthy } }
    networks: [interna]

  ms-iniciativas:
    build: { context: ../ms-iniciativas, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: db-iniciativas
      DB_NAME: ms_iniciativas_db
      DB_USER: ms_iniciativas_app
      DB_PASSWORD: ${DB_INIC_PASSWORD}
      NODE_ENV: production
    depends_on: { db-iniciativas: { condition: service_healthy } }
    networks: [interna]

  ms-radicacion:
    build: { context: ../ms-radicacion, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: db-radicacion
      DB_NAME: ms_radicacion_db
      DB_USER: ms_radicacion_app
      DB_PASSWORD: ${DB_RAD_PASSWORD}
      NODE_ENV: production
    depends_on: { db-radicacion: { condition: service_healthy } }
    networks: [interna]

  ms-flujo-estados:
    build: { context: ../ms-flujo-estados, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: db-flujo
      DB_NAME: ms_flujo_estados_db
      DB_USER: ms_flujo_estados_app
      DB_PASSWORD: ${DB_FLUJO_PASSWORD}
      NODE_ENV: production
    depends_on: { db-flujo: { condition: service_healthy } }
    networks: [interna]

  ms-notificaciones:
    build: { context: ../ms-notificaciones, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3005
      DB_HOST: db-notificaciones
      DB_NAME: ms_notificaciones_db
      DB_USER: ms_notificaciones_app
      DB_PASSWORD: ${DB_NOTI_PASSWORD}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      db-notificaciones: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [interna]

  ms-administracion:
    build: { context: ../ms-administracion, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3006
      DB_HOST: db-admin
      DB_NAME: ms_administracion_db
      DB_USER: ms_administracion_app
      DB_PASSWORD: ${DB_ADMIN_PASSWORD}
      NODE_ENV: production
    depends_on: { db-admin: { condition: service_healthy } }
    networks: [interna]

  # ----- API Gateway -----

  api-gateway:
    build: { context: ../api-gateway, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3000
      ORIGEN_PERMITIDO: ${ORIGEN_PERMITIDO}
      MS_AUTENTICACION_URL: http://ms-autenticacion:3001
      MS_INICIATIVAS_URL: http://ms-iniciativas:3002
      MS_RADICACION_URL: http://ms-radicacion:3003
      MS_FLUJO_URL: http://ms-flujo-estados:3004
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:3005
      MS_ADMINISTRACION_URL: http://ms-administracion:3006
    depends_on:
      - ms-autenticacion
      - ms-iniciativas
      - ms-radicacion
      - ms-flujo-estados
      - ms-notificaciones
      - ms-administracion
    networks: [interna]

  # ----- Frontends -----

  front-tablero:
    build: { context: ../front-tablero, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    ports: ["${PUERTO_TABLERO:-8080}:80"]
    depends_on: [api-gateway]
    networks: [interna]

  front-radicacion:
    build: { context: ../front-radicacion, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    ports: ["${PUERTO_RADICACION:-8081}:80"]
    depends_on: [api-gateway]
    networks: [interna]

  front-admin:
    build: { context: ../front-admin, dockerfile: docker/Dockerfile }
    restart: unless-stopped
    ports: ["${PUERTO_ADMIN:-8082}:80"]
    depends_on: [api-gateway]
    networks: [interna]

volumes:
  datos_auth:
  datos_iniciativas:
  datos_radicacion:
  datos_flujo:
  datos_notificaciones:
  datos_admin:
  datos_redis:

networks:
  interna:
    driver: bridge
