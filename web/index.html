<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Iniciativas Legislativas · Ministerio del Interior</title>

<!--
  El canal por el que un ciudadano recibe este enlace es WhatsApp, y sin
  estos metadatos llegaba como una tarjeta gris sin imagen, sin resumen y
  con un icono de página en blanco: nada indicaba que fuera un sitio del
  Estado. El <head> tenía solo charset, viewport y título.
-->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b42b6">

<!-- Fuente Inter: tipografía moderna y limpia para la interfaz -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<meta name="description" content="Consulte el estado de una iniciativa legislativa del Viceministerio para el Diálogo Social y los Derechos Humanos, o registre una propuesta ciudadana con su código único de trámite.">

<!-- Vista previa al compartir el enlace -->
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<meta property="og:site_name" content="Ministerio del Interior · República de Colombia">
<meta property="og:title" content="Iniciativas Legislativas del Viceministerio para el Diálogo Social y los Derechos Humanos">
<meta property="og:description" content="Consulte el avance de un trámite por su código, o registre una propuesta ciudadana. No requiere tener cuenta.">
<meta name="twitter:card" content="summary">

<!--
  No se indexa: el tablero muestra trámites de consulta previa y de
  garantías para personas defensoras de derechos humanos. Que el enlace se
  pueda compartir a propósito es una cosa; que un buscador guarde copia de
  los listados es otra.
-->
<meta name="robots" content="noindex, nofollow">
