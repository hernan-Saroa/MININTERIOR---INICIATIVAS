<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Iniciativas legislativas">
  <!--
    Marca neutra a propósito: un expediente con su sello, no el escudo ni el
    logotipo del Ministerio. Un favicon que imite la identidad institucional
    parecería una publicación oficial venga de donde venga, y esto es una
    herramienta de trabajo interno.

    En SVG porque pesa medio kilobyte y se ve nítido en cualquier densidad de
    pantalla, sin necesidad de varios tamaños.
  -->
  <rect width="32" height="32" rx="6" fill="#101a2e"/>
  <!-- La hoja del expediente -->
  <path d="M9 7h10l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="#ffffff"/>
  <!-- El doblez de la esquina -->
  <path d="M19 7l5 5h-5V7z" fill="#c7d2ea"/>
  <!-- Las líneas del texto -->
  <rect x="11" y="15" width="10" height="1.6" rx=".8" fill="#69707e"/>
  <rect x="11" y="18.4" width="10" height="1.6" rx=".8" fill="#69707e"/>
  <!-- El sello de trámite, en el azul de acción -->
  <circle cx="16" cy="23.6" r="2.4" fill="#2151d1"/>
</svg>
