# =====================================================================
# Orquestación completa de la plataforma (producción).
#
#   cp .env.example .env   (y completar)
#   docker compose up -d --build
#
# La definición real de los servicios vive en infra-iniciativas, junto al
# resto de la infraestructura. Este archivo solo la incluye para que
# `docker compose up` funcione desde la raíz del repositorio agregador.
#
# La versión anterior de este archivo describía el MONOLITO (servicios
# `api` y `web`, `docker/api.Dockerfile`, volumen `./db`), todo retirado al
# pasar a multi-repositorio. Ejecutarla fallaba porque esas rutas ya no
# existen. Ver docs/auditoria-qa.md (F-01).
# =====================================================================

include:
  - infra-iniciativas/docker-compose.yml
