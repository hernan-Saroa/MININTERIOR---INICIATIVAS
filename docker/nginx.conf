server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 1m;

  # La API va al contenedor del backend. Al quedar todo bajo el mismo
  # dominio no hay CORS ni cookies entre orígenes.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Los archivos con huella de contenido se pueden cachear indefinidamente
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Aplicación de una sola página: cualquier ruta desconocida sirve el index
  location / {
    try_files $uri $uri/ /index.html;
  }
}
