# =====================================================================
# Desarrollo. Levanta SOLO la base (una sola, ya migrada) para trabajar
# los microservicios en caliente desde el disco:
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd ms-autenticacion && npm install && npm run dev   # y cada MS
#   cd front-tablero    && npm install && npm run dev
#
# Las 17 migraciones viven centralizadas en db-iniciativas/migraciones.
# El migrador-dev las aplica en orden numerico al levantar.
# =====================================================================

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: desarrollo
      MYSQL_DATABASE: iniciativas_legislativas
      MYSQL_USER: iniciativas_app
      MYSQL_PASSWORD: desarrollo
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports:
      # Solo en desarrollo: permite conectar un cliente y los MS locales.
      - "127.0.0.1:3306:3306"
    volumes:
      - datos_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdesarrollo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  migrador-dev:
    image: mysql:8.4
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_PWD: desarrollo
    volumes:
      # Fuente unica: el repo centralizado de base de datos
      - ./db-iniciativas/migraciones:/migraciones:ro
    command:
      - sh
      - -c
      - |
        set -e
        echo "Aplicando migraciones desde db-iniciativas..."
        for f in /migraciones/*.sql; do
          echo "  -> $$(basename $$f)"
          mysql --default-character-set=utf8mb4 -h mysql -u root iniciativas_legislativas < "$$f"
        done
        echo "Base de desarrollo lista."
    restart: "no"

volumes:
  datos_mysql_dev:

